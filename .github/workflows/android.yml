name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sip:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Start Asterisk with SIP over WebSocket
        run: sip/asterisk-test/run.sh
      - name: SIP client tests against Asterisk
        working-directory: sip
        env:
          H2O_SIP_WS: ws://localhost:8088/ws
        run: ../gradlew --no-configuration-cache test
      - name: Asterisk log
        if: failure()
        run: docker logs h2o-asterisk-test

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew --no-configuration-cache :api:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Lint findings
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PdebugSignRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      # One artifact per ABI and build type, so a phone install only downloads arm64.
      # Release APKs are shrunk with R8 and signed with the debug key.
      - uses: actions/upload-artifact@v7
        with:
          name: h2open-driver-arm64-release-apk
          path: app/build/outputs/apk/release/*-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: h2open-driver-arm64-debug-apk
          path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: h2open-driver-x86_64-debug-apk
          path: app/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk | awk '{printf "%6.1f MB  %s\n", $5/1048576, $9}' | tee -a "$GITHUB_STEP_SUMMARY"
