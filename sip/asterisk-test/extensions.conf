[h2o-drivers]
; 600: answers and stays up for a while, then hangs up.
exten => 600,1,Answer()
 same => n,Wait(${IF($["${CALLERID(num)}" = "1002"]?1:20)})
 same => n,Hangup()
; 601: busy.
exten => 601,1,Busy(5)
; 602: rings and never answers.
exten => 602,1,Ringing()
 same => n,Wait(60)
; Driver to driver.
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
