; Test-only PJSIP config for the SIP client tests (plain ws, no TLS).
; Production gets its endpoints from Odoo through ARI (h2o_telephony).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[endpoint-template](!)
type=endpoint
context=h2o-drivers
disallow=all
allow=alaw
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes
transport=transport-ws

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes

[1001](endpoint-template)
auth=1001
aors=1001
[1001](auth-template)
username=1001
password=secret1001
[1001](aor-template)

[1002](endpoint-template)
auth=1002
aors=1002
[1002](auth-template)
username=1002
password=secret1002
[1002](aor-template)

; Like the endpoints Odoo pushes: WebRTC on (DTLS-SRTP, ICE, AVPF).
[1003](endpoint-template)
webrtc=yes
auth=1003
aors=1003
[1003](auth-template)
username=1003
password=secret1003
[1003](aor-template)
